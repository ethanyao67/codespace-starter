<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Interactive NHL Height Chart</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #071b2f; color: #f8fbff; }
      .wrap { padding: 20px; }
      #plot { width: 100%; height: 520px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="plot"></div>
    </div>
    <script>
      const data = [
        {
          x: ['Defense','Forward','Goalie','Other'],
          y: [184, 181, 179, 171],
          type: 'bar',
          marker: { color: ['#4fd1c5','#70b7ff','#ff6b6b','#f7d774'] },
          name: 'Average height'
        }
      ];
      const layout = {
        title: 'Average height by position group',
        paper_bgcolor: '#071b2f',
        plot_bgcolor: '#071b2f',
        font: { color: '#f8fbff', family: 'Segoe UI, sans-serif' },
        xaxis: { title: 'Position group', gridcolor: '#214a67' },
        yaxis: { title: 'Height (cm)', gridcolor: '#214a67' },
        margin: { t: 50, r: 20, b: 50, l: 50 }
      };
      Plotly.newPlot('plot', data, layout, {displayModeBar: false});
    </script>
  </body>
</html>
